<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--blue:#0a4fd0;--red:#d8321f;--paper:#d9dde0;--bold:"Arial Black","Helvetica Neue",Arial,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#111;font-family:var(--bold)}
#bg{position:fixed;inset:0;background:#1e1e1e center/cover no-repeat;filter:contrast(1.05) saturate(.9) brightness(.85)}
#bg.art{filter:none}
#bg.art::after{display:none}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05) 35%,rgba(0,0,0,.55) 100%)}
#grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:900;opacity:.2;mix-blend-mode:overlay;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.6 -.3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
animation:g .6s steps(6) infinite}
@keyframes g{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
#top{position:fixed;left:0;top:0;z-index:99999;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0}
#all,#go{font-family:var(--bold);font-weight:900;text-transform:uppercase;color:#000;background:#fff;border:3px solid #000;box-shadow:5px 5px 0 #000;cursor:pointer;transition:transform .08s,box-shadow .08s,background .12s,color .12s}
#all{font-size:15px;letter-spacing:.08em;padding:11px 18px}
#go{position:fixed;z-index:850;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;white-space:nowrap;text-transform:none;letter-spacing:0;background:#fcf6ec;color:#000;border:3px solid #000;box-shadow:5px 5px 0 #000;font-size:26px}
#all:hover,#go:hover{background:var(--red);color:#fff}
#all:active,#go:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #000}
.win{position:fixed;z-index:10;width:400px;height:200px;display:flex;flex-direction:column;overflow:hidden;background:#b9b5ac;border:2px solid #b9b5ac;border-top:0;border-radius:7px 7px 0 0;box-shadow:0 0 0 1px #4b4741,5px 5px 0 rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none;animation:pop .22s ease-out}
.win[hidden]{display:none}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.bar{height:24px;flex:none;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#a8a498 0,#b3afa3 30%,#cbc7bc 55%,#ebe8df 80%,#fffff8 90%,#d9d8d3 100%);border-top:1px solid #fdf9f0;color:#000;font:700 13px "Trebuchet MS",Tahoma,Verdana,"Noto Sans JP","Hiragino Sans",sans-serif;padding:0 3px 0 7px;white-space:nowrap;cursor:grab;border-radius:6px 6px 0 0}
.bar:active{cursor:grabbing}
.ttl{overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex:none}
.xb{width:20px;height:20px;margin-left:3px;border-radius:4px;font:700 13px/1 Tahoma,Verdana,sans-serif;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
.hb{background:linear-gradient(#efece3,#c9c5ba);border:1px solid #6b675c;color:#2a2a2a}
.x{background:linear-gradient(#f45a5a,#e5171a 50%,#cf1a1f);border:1px solid #f0b0ab;color:#fff;box-shadow:0 0 0 1px #a3262b}
.xb:hover{filter:brightness(1.1)}
.xb:active{filter:brightness(.85)}
.body{flex:1;min-height:0;display:flex;padding:0;background:#1f1f1f;box-shadow:inset 0 0 0 1px #000;cursor:pointer}
.body img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;transition:transform .2s}
.body:hover img{transform:scale(1.05)}
@media(max-width:700px){.win{width:min(400px,80vw);height:min(200px,40vw)}#all{font-size:13px;padding:9px 12px}}
#prod{position:fixed;inset:0;z-index:100001;background:#f3f3f1;color:#111;overflow:auto;font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans JP","Hiragino Sans",sans-serif;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#prod[hidden]{display:none}
.pbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 14px) 24px 14px;background:rgba(243,243,241,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #dcdcd8}
.back,#pclose{border:1.5px solid #111;background:transparent;color:#111;font:700 12px "Helvetica Neue",Helvetica,Arial,"Noto Sans JP","Hiragino Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:11px 18px;border-radius:999px;cursor:pointer;transition:.15s}
.back:hover,#pclose:hover{background:#111;color:#fff}
#pclose{margin-left:auto;width:40px;height:40px;padding:0;font-size:14px}
.path{font-size:13px;color:#777;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path b{color:#111;font-weight:600}
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;max-width:1280px;margin:0 auto;padding:32px 24px 72px;align-items:start}
.pic{background:#e6e6e2;border-radius:24px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:sticky;top:92px}
.pic img{width:86%;height:86%;object-fit:contain}
.info h2{margin:0 0 14px;font:800 clamp(32px,4.2vw,60px)/.96 "Helvetica Neue",Helvetica,Arial,"Noto Sans JP","Hiragino Sans",sans-serif;letter-spacing:-.035em;text-transform:uppercase}
.price{font-size:26px;font-weight:600;color:#d8321f;margin-bottom:40px}
.lbl{font:700 12px "Helvetica Neue",Helvetica,Arial,"Noto Sans JP","Hiragino Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#777;margin-bottom:12px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:32px}
.sizes button{height:56px;border:1.5px solid #cfcfca;background:#fff;border-radius:14px;font:600 15px "Helvetica Neue",Helvetica,Arial,"Noto Sans JP","Hiragino Sans",sans-serif;cursor:pointer;transition:.15s}
.sizes button:hover{border-color:#111}
.sizes button.on{background:#111;color:#fff;border-color:#111}
.buy{display:flex;gap:10px}
#heart{width:64px;height:64px;border:1.5px solid #cfcfca;background:#fff;border-radius:16px;font-size:24px;cursor:pointer;transition:.15s;color:#111}
#heart.on{color:#d8321f;border-color:#d8321f}
#addb{flex:1;height:64px;border:0;border-radius:16px;background:#111;color:#fff;font:700 15px "Helvetica Neue",Helvetica,Arial,"Noto Sans JP","Hiragino Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.15s}
#addb:hover{background:#d8321f}
#addb:active{transform:scale(.98)}
#prod .lbl{color:#d8321f}
.sizes button{color:#d8321f;font-weight:800;font-size:21px;letter-spacing:.04em;border:2px solid #d8321f;animation:szIn .5s cubic-bezier(.2,.9,.3,1.25) backwards;transition:transform .18s,background .18s,color .18s,box-shadow .18s}
.sizes button:nth-child(1){animation-delay:.05s}.sizes button:nth-child(2){animation-delay:.12s}.sizes button:nth-child(3){animation-delay:.19s}.sizes button:nth-child(4){animation-delay:.26s}.sizes button:nth-child(5){animation-delay:.33s}.sizes button:nth-child(6){animation-delay:.4s}
@keyframes szIn{from{opacity:0;transform:translateY(16px) scale(.85)}}
.sizes button:hover{transform:translateY(-4px) scale(1.06);border-color:#d8321f;box-shadow:0 8px 18px rgba(216,50,31,.3)}
.sizes button.on{background:#d8321f;color:#fff;border-color:#d8321f;transform:scale(1.07);animation:szPulse .55s ease-out}
@keyframes szPulse{0%{box-shadow:0 0 0 0 rgba(216,50,31,.65)}100%{box-shadow:0 0 0 16px rgba(216,50,31,0)}}
.sizes.nudge{animation:nudge .45s}
@keyframes nudge{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media(max-width:760px){.pbar{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}.main{grid-template-columns:1fr;gap:24px;padding:16px 14px 90px}.pic{position:static;border-radius:18px}.buy{position:sticky;bottom:12px;background:#f3f3f1;padding:8px 0}}

:root{--r:#e03127;--df:"Dela Gothic One","Noto Sans JP","Hiragino Sans","Yu Gothic",Arial,sans-serif;--ab:"Arial Black","Helvetica Neue",Arial,sans-serif}
#cat{position:fixed;inset:0;z-index:100000;background:#fcf6ec;overflow:auto;font-family:var(--df);animation:fade .25s ease}
#cat[hidden]{display:none}
.dh{position:sticky;top:0;z-index:5;height:calc(72px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 24px 0;background:#1e1e1e;display:flex;align-items:center;justify-content:space-between}
.dh img{height:40px;width:auto;cursor:pointer;transition:transform .15s}
.dh img:hover{transform:scale(1.06) rotate(-2deg)}
.dt{position:absolute;left:50%;transform:translateX(-50%);color:var(--r);font-size:clamp(24px,3.6vw,44px);white-space:nowrap;line-height:1}
.dic{display:flex;gap:16px;align-items:center}
.ic{position:relative;background:none;border:0;padding:4px;cursor:pointer;display:flex;transition:transform .15s}
.ic:hover{transform:translateY(-3px) rotate(-5deg)}
.ic svg{width:38px;height:38px;stroke:#f0ebdd;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bd{position:absolute;top:-3px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--r);color:#fff;font:900 12px/20px Arial,sans-serif;text-align:center;font-style:normal;display:none}
.bd.on{display:block;animation:pop .25s}
.pbar .ic svg{stroke:#111}
.pbar .dic{margin-left:auto}
.pbar .dic+#pclose{margin-left:0}
.dbody{position:relative;min-height:calc(100vh - 72px)}
.drect{position:absolute;right:0;top:0;width:max(60px,9vw);height:min(24vh,130px);background:var(--r)}
.dtl,.dvl,.dvr{position:absolute;color:var(--r)}
.dtl{left:18px;top:16px;font-size:15px}
.dvl,.dvr{writing-mode:vertical-rl;font-size:clamp(16px,2vw,22px);letter-spacing:.12em;line-height:1.1}
.dvl{left:clamp(12px,6.5vw,92px);top:34%}
.dvr{right:14px;top:62%}
.dgrid{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:34px 4vw;width:min(72%,980px);margin:0 auto;padding:46px 0 90px}
.it{flex:0 0 calc((100% - 8vw)/3);text-align:center;cursor:pointer;animation:szIn .5s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--k)*.08s + .1s)}
.it img{display:block;width:100%;height:auto;transition:transform .2s}
.it:hover img{transform:translateY(-8px) rotate(-1.5deg) scale(1.04)}
.it span{display:block;margin-top:4px;font:900 clamp(16px,1.9vw,22px) var(--ab);color:#000}
#dw{position:fixed;inset:0;z-index:100003;display:flex;justify-content:flex-end;background:rgba(0,0,0,.5);animation:fade .2s}
#dw[hidden]{display:none}
.dp{width:min(420px,100%);height:100%;background:#fcf6ec;display:flex;flex-direction:column;border-left:3px solid #000;animation:slide .25s ease-out;font-family:var(--ab)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.dph{background:#1e1e1e;color:#fcf6ec;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 16px;font:400 24px var(--df)}
.dph small{display:block;font:700 11px var(--ab);letter-spacing:.2em;color:#e8a29b;margin-top:4px}
.dpx{width:38px;height:38px;border:2px solid #fcf6ec;border-radius:50%;background:none;color:#fcf6ec;font:900 15px Arial,sans-serif;cursor:pointer;transition:.15s}
.dpx:hover{background:var(--r);border-color:var(--r)}
.dpb{flex:1;overflow:auto;padding:6px 18px}
.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:2px solid #1e1e1e}
.row img{width:72px;height:72px;object-fit:contain;background:#1e1e1e;border:2px solid #000;cursor:pointer;flex:none}
.rt{flex:1;min-width:0}
.rn{font:400 16px var(--df);color:#000}
.rs{font:700 12px Arial,sans-serif;letter-spacing:.1em;color:#666;margin:4px 0}
.rp{font:900 16px var(--ab);color:var(--r);margin-top:4px}
.rx{width:34px;height:34px;border:2px solid #000;border-radius:50%;background:none;font:900 13px Arial,sans-serif;cursor:pointer;flex:none;transition:.15s}
.rx:hover{background:var(--r);color:#fff;border-color:var(--r)}
.qty{display:flex;align-items:center;gap:8px;flex:none;font:900 16px var(--ab)}
.qty button{width:32px;height:32px;border:2px solid #000;border-radius:8px;background:#fff;font:900 18px/1 Arial,sans-serif;cursor:pointer;padding:0;transition:.15s}
.qty button:hover{background:#1e1e1e;color:#fff}
.emp{padding:48px 0;text-align:center;color:#777;font:700 14px Arial,sans-serif}
.dpf{padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:3px solid #000}
.tot{display:flex;justify-content:space-between;font:900 22px var(--ab);margin-bottom:12px}
#chk{width:100%;height:56px;border:3px solid #000;background:var(--r);color:#fff;font:900 15px var(--ab);letter-spacing:.1em;box-shadow:4px 4px 0 #000;cursor:pointer;transition:transform .08s,box-shadow .08s}
#chk:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
#chkm{margin-top:10px;font:700 12px Arial,sans-serif;color:#666;text-align:center;min-height:14px}
@media(max-width:760px){.dvl,.dvr{display:none}.dgrid{width:92%;gap:24px 4vw;padding-top:36px}.it{flex-basis:calc((100% - 4vw)/2)}.dh{padding-left:14px;padding-right:14px}.dh img{height:30px}.ic svg{width:30px;height:30px}.dic{gap:10px}}
.ic.in::after{content:"";position:absolute;left:2px;bottom:2px;width:10px;height:10px;border-radius:50%;background:#35c46a}
.acc{padding:14px 0 4px}
.tabs{display:flex;margin-bottom:14px;border:3px solid #000}
.tabs button{flex:1;height:44px;border:0;background:#fcf6ec;font:900 13px var(--ab);letter-spacing:.08em;cursor:pointer}
.tabs button.on{background:#1e1e1e;color:#fcf6ec}
#af label{display:block;margin-bottom:12px;font:900 11px var(--ab);letter-spacing:.14em;color:#000}
#af input{display:block;width:100%;height:50px;margin-top:6px;border:3px solid #000;border-radius:0;background:#fff;padding:0 12px;font:600 16px Arial,sans-serif;outline:none}
#af input:focus{border-color:var(--r)}
.ab{width:100%;height:54px;border:3px solid #000;background:var(--r);color:#fff;font:900 15px var(--ab);letter-spacing:.1em;box-shadow:4px 4px 0 #000;cursor:pointer;transition:transform .08s,box-shadow .08s}
.ab:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.ab.alt{background:#fff;color:#000}
.amsg{min-height:18px;margin:12px 0 4px;font:700 13px Arial,sans-serif;color:var(--r)}
.who{margin-bottom:14px;font:700 12px Arial,sans-serif;letter-spacing:.1em;color:#666}
.who b{display:block;margin-top:4px;font:900 17px var(--ab);letter-spacing:0;color:#000;word-break:break-all}
.sec{margin-top:14px;padding:18px 0 4px;border-top:3px solid #000;font:900 12px var(--ab);letter-spacing:.2em;color:#000}
</style></head><body>

<script>
/* ===== Imágenes: carpeta "remeras" junto a este index.html ===== */
const DIR='remeras/';
const FILES={
 logo:'LOGO_2_copia_1.png',
 shirts:['REMERA_UNO.png','REMERA_DOS.png','REMERA_TRES.png','REMERA_CUATRO.png','REMERA_CINCO.png'],
 bgs:['uno.png','dos.png','tres.png','cuatro.png','cinco.png','seis.png','ocho.png','nueve.png','diez.png','once.png','doce.png','trece.png','catorce.png']
};
const IMG=f=>encodeURI(DIR+f);
const B=FILES.bgs.map(f=>({s:IMG(f),w:1920,h:1080,px:50,a:1}));
B.push({s:IMG('2.jpg'),w:1200,h:675,px:78,a:0,z:1.06});
/* ================================================================= */
const bgEl=document.getElementById('bg'),goEl=document.getElementById('go');
let cur;
function setBg(){let n;do{n=B[Math.floor(Math.random()*B.length)]}while(n===cur&&B.length>1);cur=n;
bgEl.style.backgroundImage='url("'+cur.s+'")';bgEl.style.backgroundPosition=cur.px+'% 50%';bgEl.style.transform=cur.z?'scale('+cur.z+')':'';bgEl.classList.toggle('art',!!cur.a);layoutGo()}
function backHome(){cat.hidden=true;setBg()}
setBg();
function layoutGo(){
 const vw=innerWidth,vh=innerHeight,s=Math.max(vw/cur.w,vh/cur.h),rw=cur.w*s,rh=cur.h*s,ox=(vw-rw)*cur.px/100,oy=(vh-rh)/2;
 const bw=rw*287/1920,bh=rh*97/1080,bx=ox+rw*1529/1920,by=oy+rh*874/1080,e=3,st=goEl.style;
 if(bx>=e&&by>=e&&bx+bw<=vw-e&&by+bh<=vh-e){
  st.left=bx-e+'px';st.top=by-e+'px';st.width=bw+2*e+'px';st.height=bh+2*e+'px';st.right='auto';st.bottom='auto';st.fontSize=bh*.62+'px'}
 else{st.left='auto';st.top='auto';st.right='16px';st.bottom='calc(env(safe-area-inset-bottom,0px) + 16px)';st.width='170px';st.height='58px';st.fontSize='26px'}}
layoutGo();addEventListener('resize',layoutGo);
const S=FILES.shirts.map(IMG);
const N=['赤い靴','灰色の午後','黒い影','きつねの夢','夢の星'];
const D=[[.01,.10],[.73,.08],[.01,.54],[.73,.52],[.24,.03],[.47,.02],[.20,.56],[.52,.70],[.34,.72],[.80,.30]];
const M=[[.02,.07],[.46,.10],[.02,.21],[.46,.27],[.02,.57],[.46,.50],[.02,.71],[.46,.65],[.24,.80],[.24,.03]];
const P=D.map((d,i)=>({t:N[i%5]+(i>=5?' 02':''),s:S[i%5],d,m:M[i]}));
let z=10,drag=null,moved=false,downBar=false;
const clamp=w=>{const mx=innerWidth-w.offsetWidth,my=innerHeight-w.offsetHeight;
 w.style.left=Math.max(0,Math.min(mx,w.offsetLeft))+'px';w.style.top=Math.max(52,Math.min(Math.max(52,my),w.offsetTop))+'px'};
const front=w=>{w.style.zIndex=++z};
function setup(w){
 w.addEventListener('pointerdown',e=>{if(e.target.closest('.xb'))return;front(w);moved=false;downBar=!!e.target.closest('.bar');
  drag={w,sx:e.clientX,sy:e.clientY,ox:w.offsetLeft,oy:w.offsetTop};w.setPointerCapture(e.pointerId)});
 w.addEventListener('pointermove',e=>{if(!drag||drag.w!==w)return;
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(!moved)return;w.style.left=drag.ox+dx+'px';w.style.top=drag.oy+dy+'px';clamp(w)});
 const up=()=>{drag=null};w.addEventListener('pointerup',up);w.addEventListener('pointercancel',up);
}
P.forEach(p=>{
 const w=document.createElement('div');w.className='win';w.hidden=true;
 w.innerHTML=`<div class="bar"><span class="ttl">${p.t}</span><span class="ctl"><button class="xb hb" aria-label="Ayuda">?</button><button class="xb x" aria-label="Cerrar">X</button></span></div><div class="body"><img src="${p.s}" alt="${p.t}"></div>`;
 document.body.appendChild(w);p.w=w;setup(w);
 w.querySelector('.x').onclick=e=>{e.stopPropagation();w.hidden=true;sync()};
 w.querySelector('.hb').onclick=e=>e.stopPropagation();
 w.addEventListener('click',e=>{if(moved||downBar)return;openProd(P.indexOf(p)%5)});
 w.querySelector('img').onload=()=>clamp(w);
});
function place(p){const [fx,fy]=innerWidth<700?p.m:p.d;
 p.w.style.left=fx*innerWidth+'px';p.w.style.top=fy*innerHeight+'px';clamp(p.w)}
function sync(){document.getElementById('all').hidden=!P.some(p=>!p.w.hidden)}
function show(p,reopen){if(reopen){p.w.hidden=false;p.w.style.animation='none';void p.w.offsetWidth;p.w.style.animation='';place(p)}front(p.w);sync()}
function openAll(gap){P.forEach((p,i)=>setTimeout(()=>show(p,p.w.hidden),i*gap))}
const cat=document.getElementById('cat'),prod=document.getElementById('prod'),dw=document.getElementById('dw');
const PN=[70,70,70,70,70],PRICE=PN.map(n=>n+'USD');
let psize=null,curI=0,cart=[],favs=[],dmode='cart';
document.getElementById('dlogo').src=IMG(FILES.logo);
const dgrid=document.getElementById('dgrid');
[1,3,4,2,0].forEach((i,k)=>{const d=document.createElement('div');d.className='it';d.style.setProperty('--k',k);
 d.innerHTML='<img src="'+S[i]+'" alt="'+N[i]+'"><span>'+PRICE[i]+'</span>';d.onclick=()=>openProd(i);dgrid.appendChild(d)});
document.getElementById('go').onclick=()=>{cat.hidden=false;cat.scrollTop=0};
document.getElementById('dlogo').onclick=()=>{backHome()};
document.getElementById('all').onclick=()=>{P.forEach(p=>p.w.hidden=true);sync()};
addEventListener('resize',()=>P.forEach(p=>!p.w.hidden&&clamp(p.w)));
setTimeout(()=>openAll(160),300);
function badges(){const nf=favs.length,nc=cart.reduce((a,c)=>a+c.q,0);
 document.querySelectorAll('[data-b=fav]').forEach(e=>{e.textContent=nf;e.classList.toggle('on',nf>0)});
 document.querySelectorAll('[data-b=cart]').forEach(e=>{e.textContent=nc;e.classList.toggle('on',nc>0)})}
function syncHeart(){const on=favs.includes(curI);heart.classList.toggle('on',on);heart.innerHTML=on?'&#9829;':'&#9825;'}
function openProd(i){curI=i;psize=null;const n=N[i];
 ppath.innerHTML='Inicio &#9656; ドロップ 3 &#9656; <b>'+n+'</b>';
 ptitle.textContent=n;pprice.textContent=PRICE[i];pimg.src=S[i];pimg.alt=n;
 syncHeart();addb.textContent='Encargar';
 sizes.innerHTML=['M','L','XL'].map(s=>'<button>'+s+'</button>').join('');
 [...sizes.children].forEach(b=>b.onclick=()=>{[...sizes.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');psize=b.textContent;addb.textContent='Encargar'});
 prod.hidden=false;prod.scrollTop=0}
heart.onclick=()=>{const k=favs.indexOf(curI);k<0?favs.push(curI):favs.splice(k,1);syncHeart();badges()};
addb.onclick=()=>{if(!psize){sizes.classList.remove('nudge');void sizes.offsetWidth;sizes.classList.add('nudge');addb.textContent='ELEG\u00cd UN TALLE';return}
 const it=cart.find(c=>c.i===curI&&c.s===psize);it?it.q++:cart.push({i:curI,s:psize,q:1});badges();addb.textContent='ENCARGADO \u2713 '+psize};
pclose.onclick=pback.onclick=()=>{prod.hidden=true};
let user=null,authMode='login',authMsg='',authEmail='';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setMsg(m){authMsg=m;const el=document.getElementById('am');if(el)el.textContent=m}
function favRows(){return favs.length?favs.map(i=>'<div class="row"><img src="'+S[i]+'" data-v="'+i+'" alt=""><div class="rt"><div class="rn">'+N[i]+'</div><div class="rp">'+PRICE[i]+'</div></div><button class="rx" data-rf="'+i+'" aria-label="Quitar">&#10005;</button></div>').join(''):'<div class="emp">Todavía no tenés favoritos.</div>'}
function renderUser(db){
 let h='<div class="acc">';
 h+='<div class="tabs"><button data-a="m-login" class="'+(authMode==='login'?'on':'')+'">INGRESAR</button><button data-a="m-reg" class="'+(authMode==='reg'?'on':'')+'">CREAR CUENTA</button></div>'
  +'<form id="af" novalidate><label>CORREO<input type="email" id="ae" autocomplete="email" placeholder="tu@correo.com" value="'+esc(authEmail)+'"></label>'
  +'<label>CONTRASEÑA<input type="password" id="ap" autocomplete="'+(authMode==='login'?'current-password':'new-password')+'" placeholder="Mínimo 6 caracteres"></label>'
  +'<button class="ab" type="submit">'+(authMode==='login'?'INGRESAR':'REGISTRARME')+'</button></form>';
 h+='<div class="amsg" id="am">'+esc(authMsg)+'</div></div><div class="sec">FAVORITOS</div>'+favRows();
 db.innerHTML=h}
function doAuth(){
 const email=authEmail.trim(),pw=document.getElementById('ap').value;
 if(!/^\S+@\S+\.\S+$/.test(email)){setMsg('Ingresá un correo válido.');return}
 if(pw.length<6){setMsg('La contraseña debe tener al menos 6 caracteres.');return}
 setMsg('El registro todavía no está habilitado.')}
const dbEl=document.getElementById('dbody');
dbEl.addEventListener('input',e=>{if(e.target.id==='ae')authEmail=e.target.value});
dbEl.addEventListener('submit',e=>{e.preventDefault();doAuth()});
dbEl.addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='m-login'||a==='m-reg'){authMode=a==='m-login'?'login':'reg';authMsg='';renderDW()}
 });
function renderDW(){
 const dt=document.getElementById('dtitle'),db=document.getElementById('dbody'),df=document.getElementById('dfoot');
 if(dmode==='user'){dt.innerHTML='ユーザー<small>USUARIO</small>';df.hidden=true;renderUser(db)}
 else if(dmode==='fav'){dt.innerHTML='お気に入り<small>FAVORITOS</small>';df.hidden=true;
  db.innerHTML=favs.length?favs.map(i=>'<div class="row"><img src="'+S[i]+'" data-v="'+i+'" alt=""><div class="rt"><div class="rn">'+N[i]+'</div><div class="rp">'+PRICE[i]+'</div></div><button class="rx" data-rf="'+i+'" aria-label="Quitar">&#10005;</button></div>').join(''):'<div class="emp">Todav\u00eda no ten\u00e9s favoritos.</div>'}
 else{dt.innerHTML='カート<small>CARRITO</small>';df.hidden=!cart.length;
  db.innerHTML=cart.length?cart.map((c,k)=>'<div class="row"><img src="'+S[c.i]+'" data-v="'+c.i+'" alt=""><div class="rt"><div class="rn">'+N[c.i]+'</div><div class="rs">TALLE '+c.s+'</div><div class="rp">'+PN[c.i]*c.q+'USD</div></div><div class="qty"><button data-q="'+k+'" data-d="-1">&minus;</button><b>'+c.q+'</b><button data-q="'+k+'" data-d="1">+</button></div></div>').join(''):'<div class="emp">Tu carrito est\u00e1 vac\u00edo.</div>';
  document.getElementById('dtot').textContent=cart.reduce((a,c)=>a+PN[c.i]*c.q,0)+'USD';document.getElementById('chkm').textContent=''}}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{dmode=b.dataset.open;renderDW();dw.hidden=false});
document.getElementById('dclose').onclick=()=>{dw.hidden=true};
dw.onclick=e=>{if(e.target===dw)dw.hidden=true};
document.getElementById('chk').onclick=()=>{document.getElementById('chkm').textContent='Todav\u00eda no est\u00e1 conectado el pago.'};
document.getElementById('dbody').addEventListener('click',e=>{
 const im=e.target.closest('img[data-v]'),b=e.target.closest('button');
 if(im){dw.hidden=true;openProd(+im.dataset.v);return}
 if(!b)return;
 if(b.dataset.rf!==undefined)favs.splice(favs.indexOf(+b.dataset.rf),1);
 else if(b.dataset.q!==undefined){const c=cart[+b.dataset.q];c.q+=+b.dataset.d;if(c.q<1)cart.splice(+b.dataset.q,1)}
 else return;
 badges();renderDW();syncHeart()});
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!dw.hidden)dw.hidden=true;else if(!prod.hidden)prod.hidden=true;else if(!cat.hidden)backHome()});
</script></body></html>
